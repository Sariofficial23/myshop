name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: myshop
          POSTGRES_PASSWORD: myshop
          POSTGRES_DB: myshop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U myshop -d myshop"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://myshop:myshop@localhost:5432/myshop?schema=public
      DIRECT_URL: postgresql://myshop:myshop@localhost:5432/myshop?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm test:e2e
      - run: pnpm build
